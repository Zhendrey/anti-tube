<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results | Antitube</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="antitube-icon.svg" type="image/svg">
</head>
<body>
    <div class="wrapper">
        <header class="header">
            <a class="header__logo" href="index.html">
                <img src="./assets/images/antitube-logo.svg" alt="Anti-Tube logo"></img>
            </a>
            <nav class="header__navigation">
                <ul class="header__icon-list">
                    <li class="header__icon">
                        <a href="#">
                            <img src="./assets/images/header-settigns.svg" alt="Settings">
                        </a>
                    </li>
                    <li class="header__icon">
                        <a href="#">
                            <img src="./assets/images/header-user-profile.svg" alt="User Profile">
                        </a>
                    </li>
                </ul>
            </nav>
        </header>
        <section class="search-bar">
            <div class="search-bar__content">
                <div class="search__input">
                    <a href="#" class="search__icon-search"><img src="./assets/images/search-icon.svg" alt="Search icon"></a>
                    <input type="text" name="input-search" aria-label="A searching input" type="text" placeholder="Type a video name...">
                </div>
                <!-- TEMPORARY CHANGE FROM <button> -->
                <div class="search-bar__right">
                    <a href="results.html" class="search__button" type="submit">Search</a>
                    <a href="#" class="search__icon-filter"><img src="./assets/images/search-filter.svg" alt="Filter icon"></a>
                </div>
            </div>
        </section>
        <main class="results">
            <div class="results__content">
            </div>
        </main>
        <footer>
            <span class="app-credit">@2027 Antitube</span>
        </footer>
    </div>
    <script src="index.js"></script>
</body>
</html>
