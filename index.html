<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Antitube</title>
</head>
<body>
    <div class="wrapper">
        <header class="header">
            <a href="#"><img src="./" alt="Anti-Tube logo" class="header__logo"></img></a>
            <h2 class="header__title">Anti-Tube</h2>
            <nav class="header__navigation">
                <ul class="header__icon-list">
                    <li class="header__icon">
                        <a href="#">
                            <img src="./" alt="Settings">
                        </a>
                    </li>
                    <li class="header__icon">
                        <a href="#">
                            <img src="./" alt="User Profile">
                        </a>
                    </li>
                </ul>
            </nav>
        </header>
        <main class="search">
            <h1 class="search__title">Hello!</h1>
            <h2 class="search__subtitle">What you're looking for today?</h2>
            <form class="search__form" action="#" method="get" enctype="multipart/form-data">
                <img class="search__icon" src="./" alt="Search icon">
                <input aria-label="A searching input" type="text" placeholder="Type a video name..." class="search__input">
                <button class="search__button" type="submit">Search video</button>
            </form>
        </main>
        <footer class="app-credit">
            @2027 Anti-Tube
        </footer>
    </div>
</body>
</html>
